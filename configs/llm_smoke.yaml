# configs/llm_smoke.yaml — prove the SpikedLM pipeline quickly on CPU

model:
  n_layer: 2
  n_head: 2
  n_embd: 64
  block_size: 64
  vocab_size: 1024     # overridden from tokenizer at train time
  dropout: 0.0
  bias: true
  v_th: 0.5
  leak: 0.5
  v_minus: -1.0
  v_plus: 2.0
  alpha: 1.0
  beta: 1.0
  learnable_lif: true
  leaky_clamp_slope: 0.2
  spike_rate_weight: 0.25
  target_rate_i: 0.3
  target_rate_f: 0.5
  target_rate_o: 0.4
  rate_floor: 0.05

train:
  batch_size: 16
  max_steps: 200
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  warmup_steps: 5
  grad_clip: 1.0
  eval_interval: 50
  eval_batches: 2
  sample_interval: 100
  checkpoint_interval: 100
  seed: 1337

data:
  dataset: shakespeare
  data_dir: data/shakespeare
  train_frac: 0.9

paths:
  out_dir: checkpoints/llm_smoke
  tokenizer_path: data/shakespeare/tokenizer.json
